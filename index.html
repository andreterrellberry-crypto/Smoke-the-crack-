<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1a14" />
    <meta name="description" content="Smoke the Crack — a global clothing resell block. Walk the street, step into a store from every continent, shop its archive." />
    <title>Smoke the Crack</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='14' y='30' width='72' height='62' fill='%23a8452f' stroke='%232b1a14' stroke-width='6'/><path d='M8 34h84l-8-16H16z' fill='%23f4c430' stroke='%232b1a14' stroke-width='6'/><rect x='40' y='56' width='20' height='36' fill='%232e6b4a' stroke='%232b1a14' stroke-width='5'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Inter:wght@400;600;700;800&family=Lilita+One&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,700&family=Rye&family=Shojumaru&family=Titan+One&display=swap" rel="stylesheet" />
  </head>
  <body data-mode="aerial">
    <svg id="defs" width="0" height="0" aria-hidden="true" focusable="false"></svg>

    <div id="street-wrap">
      <svg id="street" preserveAspectRatio="xMidYMax meet" aria-label="The block — tap a storefront to go inside"></svg>
    </div>

    <section id="interior" aria-label="Inside the store">
      <svg id="room"></svg>
      <div id="bubble" aria-live="polite"></div>
      <button id="back" type="button">← Back to the block</button>
      <button id="browse" type="button">Browse the racks</button>
    </section>

    <section id="aerial" aria-label="The block from above">
      <svg id="aerial-svg" preserveAspectRatio="xMidYMid slice"></svg>
      <div class="aerial-title">
        <h1>SMOKE THE CRACK</h1>
        <p>One block. A store from every continent.</p>
        <button id="drop" type="button">Drop in ↓</button>
      </div>
    </section>

    <header id="hud">
      <div class="hud-brand">
        <span class="logo">SMOKE THE CRACK</span>
        <span class="tag">global resell block</span>
      </div>
      <div class="searchbox">
        <input id="search" type="search" placeholder="Search store, country, brand…" autocomplete="off" aria-label="Search stores, countries and brands" />
        <ul id="results" role="listbox"></ul>
      </div>
      <nav class="actions">
        <button id="shop-all" type="button">Shop All</button>
        <button id="bag-btn" type="button" aria-label="Bag">Bag <span id="bag-count" hidden>0</span></button>
      </nav>
    </header>

    <nav id="directory" aria-label="Stores on the block"></nav>
    <p id="hint">Drag, scroll or ← → to walk · Tap a storefront to go in · Tap people to see what they’re wearing</p>

    <div id="ped-card" hidden></div>

    <aside id="market" aria-label="Marketplace">
      <div class="mhead">
        <nav id="crumbs"></nav>
        <button id="market-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="mtitle">
        <div>
          <h2 id="market-title">All Stock</h2>
          <p id="market-meta"></p>
        </div>
        <select id="sort" aria-label="Sort">
          <option value="feat">Featured</option>
          <option value="low">Price: Low → High</option>
          <option value="high">Price: High → Low</option>
          <option value="old">Oldest first</option>
          <option value="new">Newest first</option>
        </select>
      </div>
      <div id="country-chips"></div>
      <div id="grid"></div>
    </aside>

    <aside id="bag" aria-label="Bag">
      <div class="mhead"><h2>Your Bag</h2><button id="bag-close" type="button" aria-label="Close">✕</button></div>
      <ul id="bag-list"></ul>
      <div class="bagfoot"><span>Total</span><b id="bag-total">$0</b></div>
      <button id="checkout" type="button">Checkout</button>
    </aside>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
