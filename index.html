<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8ed6f2" />
    <meta name="description" content="Smoke the Crack — vintage grails sold on one block. Walk the hood, step into a store from every continent, hit the booster’s van in the alley." />
    <title>Smoke the Crack</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='28' height='28' rx='8' fill='%23ffd21f' stroke='%2316121c' stroke-width='2.5'/><rect x='8' y='9' width='16' height='17' fill='%23ff3d8b' stroke='%2316121c' stroke-width='2'/><rect x='13' y='17' width='6' height='9' fill='%23ffffff' stroke='%2316121c' stroke-width='1.6'/><rect x='10' y='11' width='4' height='4' fill='%2316121c'/><rect x='18' y='11' width='4' height='4' fill='%2316121c'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Bowlby+One&family=Bungee&family=Fredoka:wght@500;600;700&family=Pacifico&family=Rubik+Bubbles&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E5%8F%A4%E7%9D%80%E7%A5%AD%E3%83%8B%E3%82%BB%E3%83%A2%E3%83%8E%E7%A6%81%E6%AD%A2&display=swap" rel="stylesheet" />
  </head>
  <body data-mode="aerial">
    <div id="street-wrap"><canvas id="street" aria-label="The block, drawn like a cartoon. Tap a storefront to go inside."></canvas></div>

    <section id="interior" aria-label="Inside the store">
      <canvas id="room"></canvas>
      <div id="bubble" aria-live="polite"></div>
      <button id="back" type="button">Back to the block</button>
      <button id="browse" type="button">Browse the racks</button>
    </section>

    <section id="aerial" aria-label="The block from above">
      <canvas id="aerial-cv"></canvas>
      <div class="aerial-title">
        <span class="issue"><i></i>LIVE FROM THE BLOCK</span>
        <h1>SMOKE THE CRACK</h1>
        <p>Vintage grails, sold on the block. A store from every continent.</p>
        <button id="drop" type="button">Drop in ▾</button>
      </div>
    </section>

    <header id="hud">
      <div class="hud-brand">
        <span class="logo">SMOKE THE CRACK</span>
        <span class="tag">grails on the block</span>
      </div>
      <div class="searchbox">
        <input id="search" type="search" placeholder="Search store, country, brand…" autocomplete="off" aria-label="Search stores, countries and brands" />
        <ul id="results" role="listbox"></ul>
      </div>
      <nav class="actions">
        <button id="shop-all" type="button">Shop<span class="wide-only"> All</span></button>
        <button id="bag-btn" type="button" aria-label="Bag">Bag <span id="bag-count" hidden>0</span></button>
      </nav>
    </header>

    <nav id="directory" aria-label="Stores on the block"></nav>
    <p id="hint">Drag, scroll or ◂ ▸ to walk · Tap a shop to go in</p>

    <div id="card" aria-hidden="true"><div><h2></h2><p></p></div></div>

    <div id="tip" hidden></div>

    <aside id="market" aria-label="Marketplace">
      <div class="mhead">
        <nav id="crumbs"></nav>
        <button id="market-close" type="button" aria-label="Close">✕</button>
      </div>
      <div class="mtitle">
        <div>
          <h2 id="market-title">All Stock</h2>
          <p id="market-meta"></p>
        </div>
        <select id="sort" aria-label="Sort">
          <option value="feat">Featured</option>
          <option value="low">Price: Low → High</option>
          <option value="high">Price: High → Low</option>
          <option value="old">Oldest first</option>
          <option value="new">Newest first</option>
        </select>
      </div>
      <div id="country-chips"></div>
      <div id="grid"></div>
    </aside>

    <aside id="bag" aria-label="Bag">
      <div class="mhead"><h2>Your Bag</h2><button id="bag-close" type="button" aria-label="Close">✕</button></div>
      <ul id="bag-list"></ul>
      <div class="bagfoot"><span>Total</span><b id="bag-total">$0</b></div>
      <button id="checkout" type="button">Checkout</button>
    </aside>

    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
